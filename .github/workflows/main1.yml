name: Verify Human Identity
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # p-retry@8.0.0 needs >=22
          cache: 'npm'

      - name: Verify Node version
        run: node -v  # should print v22.x.x. If not, setup-node failed

      - name: Install clawhub skill
        run: npx clawhub@latest install verified-agent-identity --force
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Install script dependencies
        run: |
          cd scripts
          npm ci

      - name: Create Identity & Generate Link
        run: |
          node scripts/createNewEthereumIdentity.js
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "Mbah Prince", "description": "Premium plumbers in Nigeria"}'
